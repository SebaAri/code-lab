<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <form id="todo-form">
      <label for="fname">Listar tareas pendientes:</label>
      <input type="text" id="fname" name="fname" required />
      <button type="submit" id="agregar" class="btn">Agregar</button>
    </form>

    <ol id="resultado"></ol>

    <hr /> <h3>Tareas guardadas</h3>
    <button type="button" class="mostrar-guardadas">Mostrar Tareas Guardadas</button>
    <ul id="lista-guardadas"></ul>

    <script>
      $(document).ready(function(){
            $("label").css("color", "blue");
            $("input").focus();
        });

      
    </script>
  </body>
</html>
