<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css" />
     
  </head>
  <body>

    <form id="todo-form">
      <label for="fname">Listar tareas pendientes:</label>
      <input type="text" id="fname" name="fname" required />
      <button type="submit" id="agregar" class="btn">Agregar</button>
    </form>

    <ol id="resultado"></ol>

    <hr /> <h3>Tareas guardadas</h3>
    <button type="submit" id="clear-tasks" class="btn">Limpiar Tareas Guardadas</button>
    <ol id="lista-guardadas"></ol>
<script src="main.js"></script>
   
  </body>
</html>
