<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalog Control</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="styles.css">
   <script>
    $(function() {
        $("#fecha").datepicker({
            dateFormat: "yy-mm-dd"
        });
    });
</script>
   <link rel="stylesheet" href="/resources/demos/style.css">
   <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
   <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>
   <script>
    $( function() {
      $( "#datepicker" ).datepicker();
    } );
    </script>
   </head>
<body>
    <header class="bg-primary text-white p-4 mb-4"> 
      <div class="container">
      <h1>PANEL DE CONTROL</h1>
      <h3 class="mb-0 text-center">Datalog Control optimiza las operaciones de sus clientes 
        mediante soluciones tecnológicas y metodologías de vanguardia.</h3>
     </div>
    </header>
<main class="container" >
    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <a href="index.html">
        <button class="btn btn-primary me-md-2" id="inicio1" type="button">Inicio</button>
    </a>
    <a href="operaciones.html">
        <button class="btn btn-primary me-md-2" id="operaciones" type="button">Atrás</button>
    </a>
    </div>

    <h1>Formulario:</h1>
    <form id="formularioOperacion">
    <div class="row mb-3">
        <h2><b>Nueva Operación:</b></h2>
        <label for="formGroupInput" class="form-label1"><b>Cantidad:</b></label>
        <div class="col-sm-5">
          <input type="number" class="form-control w-50" id="cantidad" placeholder="Cantidad" min="1" step="1" required>
      </div>
      </div>
      <div class="row mb-3">
        <div class="col-sm-5">
        <input type="text" class="form-control w-50"id="fecha"placeholder="DD-MM-AAAA"autocomplete="off"required>
      </div>
    </div>
    <div class="row mb-3">
        <div class="col-auto">
            <label for="formGroupInput" class="form-label1"><b>Estado:</b></label>
            <select class="form-select" id="autoSizingSelect" required>
              <option value="" selected disabled>Seleccionar estado</option>
              <option value="Procesada">Procesada</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Error">Error</option>
          </select> 
        </div>
    </div>
    <div class="row mb-3">
      <label for="formGroupInput" class="form-label2"><b>Descripción:</b></label>
      <div class="col-sm-5">
        <input type="text" class="form-control" id="descripcion" placeholder="Descripción" required>
    </div>
</div>
    
    <div class="d-grid gap-2 d-md-block">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <button type="button" class="btn btn-primary"
              onclick="window.location.href='operaciones.html'">Cancelar
            </button>
</div> 
</form>
</main>
   <footer class="bg-dark text-white text-center p-3 mt-auto">
    <div class="container">
        <p class="mb-0">&copy;2026 Datalog Control todos los derechos reservados</p>
    </div>
   </footer>
   
   <script src="js/datos.js"></script>
<script src="js/operaciones.js"></script>
</body>

</html>
