<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalog Control</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="styles.css">
   </head>
<body>
    <header class="bg-primary text-white p-4 mb-4"> 
      <div class="container">
      <h1>PANEL DE CONTROL</h1>
      <h3 class="mb-0 text-center">Datalog Control optimiza las operaciones de sus clientes 
        mediante soluciones tecnológicas y metodologías de vanguardia.</h3>
     </div>
    </header>
<main class="container" >
    
<div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button class="btn btn-primary me-md-2" id="operaciones" type="button">Operaciones</button>
  <button class="btn btn-primary me-md-2 " id="reportes" type="button">Reportes</button>
</div>
<br>
<br>
  <h1>Resumen de Operaciones:</h1>
  <br>
  <hr class="border border-primary border-2 opacity-75">
<div class="container my-4">
  <div class="row g-3">

      <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm h-100">
              <div class="card-body">
                  <h5>Total de operaciones</h5>
                  <h2 id="totalOperaciones">0</h2>
              </div>
          </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm h-100">
              <div class="card-body">
                  <h5>Procesadas</h5>
                  <h2 id="operacionesProcesadas">0</h2>
              </div>
          </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm h-100">
              <div class="card-body">
                  <h5>Pendientes</h5>
                  <h2 id="operacionesPendientes">0</h2>
              </div>
          </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm h-100">
              <div class="card-body">
                  <h5>Errores</h5>
                  <h2 id="operacionesErrores">0</h2>
              </div>
          </div>
      </div>

  </div>
</div>


</main>
   <footer class="bg-dark text-white text-center p-3 mt-auto">
    <div class="container">
        <p class="mb-0">&copy;2026 Datalog Control todos los derechos reservados</p>
    </div>
   </footer>
   <script src="js/datos.js"></script>
   <script src="js/app.js"></script>
   <script src="js/operaciones.js"></script>
   
</body>

</html>
